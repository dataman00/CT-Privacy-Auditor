<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      margin: 0;
      background-color: #f7f9fc;
    }
    h3 {
      color: #c9302c;
      margin-top: 0;
      border-bottom: 2px solid #e1e6eb;
      padding-bottom: 8px;
      font-size: 16px;
    }
    .badge-gpc {
      display: inline-block;
      background-color: #449d44;
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    p {
      font-size: 12px;
      color: #4e5964;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    ul {
      list-style-type: none;
      padding: 0;
      margin: 10px 0;
    }
    li {
      background: #fff;
      padding: 8px 12px;
      margin-bottom: 6px;
      border-left: 4px solid #c9302c;
      font-size: 12px;
      font-family: monospace;
      border-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .counter {
      background-color: #f0ad4e;
      color: white;
      font-weight: bold;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 11px;
      font-family: sans-serif;
    }
    .btn-container {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 11px;
    }
    #export-btn {
      background-color: #0275d8;
    }
    #export-btn:hover {
      background-color: #025aa5;
    }
    #clear-btn {
      background-color: #f0ad4e;
    }
    #clear-btn:hover {
      background-color: #ec971f;
    }
  </style>
</head>
<body>
  <h3>CT Privacy Auditor</h3>
  <div class="badge-gpc">SEC-GPC SIGNAL: INJECTING ACTIVE</div>
  <p>The tracking systems below ignored your broadcasted opt-out signals. Hit counters show total interception frequencies:</p>
  
  <ul id="violation-list"></ul>
  
  <div class="btn-container">
    <button id="export-btn">Export Audit Report</button>
    <button id="clear-btn">Clear Data</button>
  </div>

  <!-- CSP-compliant external script reference -->
  <script src="popup.js"></script>
</body>
</html>
